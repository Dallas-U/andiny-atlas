services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: andiny-atlas-backend:latest

    container_name: andiny-atlas-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - andiny_atlas_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  andiny_atlas_data: